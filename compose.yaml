services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./scripts/init-replica.js:/init-replica.js:ro
    entrypoint: ["mongosh", "mongodb://mongo:27017/admin?directConnection=true", "--quiet", "--file", "/init-replica.js"]
    restart: "no"

  api:
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    environment:
      PORT: "5000"
      MONGO_URI: "mongodb://mongo:27017/job_feed_db?replicaSet=rs0"
      RETRY_BASE_MS: "2000"
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  mongo_data:
